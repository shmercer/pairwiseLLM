url: https://shmercer.github.io/pairwiseLLM/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    base_font: "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    heading_font: "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    code_font: "'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace"

navbar:
  structure:
    left: [get_started, guides, statistical_design, reference, changelog]
    right: [search, github]

  components:
    home:
      icon: fa-home
      text: Home
      href: index.html

    reference:
      text: Reference
      href: reference/index.html

    get_started:
      text: "Get Started"
      href: articles/getting-started.html

    guides:
      text: "Guides"
      menu:
        - text: "Data Schemas and Prompt Management"
          href: articles/data-and-prompts.html
        - text: "Provider Controls and Recovery"
          href: articles/provider-controls-and-recovery.html
        - text: "Backends and Tested Model Configurations"
          href: articles/model-compatibility.html
        - text: "Advanced: Submitting and Polling Multiple Batches"
          href: articles/advanced-batch-workflows.html
        - text: "Guide: Adaptive Pairing"
          href: articles/adaptive-pairing.html
        - text: "Guide: Adaptive Warm Start"
          href: articles/adaptive-warm-start.html
        - text: "Guide: Linking Saved Comparisons"
          href: articles/linking-sessions.html
        - text: "Guide: Adaptive Linking"
          href: articles/adaptive-linking.html
        - text: "Standalone Bayesian BTL with CmdStan"
          href: articles/bayesian-btl.html
        - text: "Guide: Rubric Calibration"
          href: articles/rubric-calibration.html
        - text: "Prompt Template Positional Bias Testing"
          href: articles/prompt-template-bias.html

    statistical_design:
      text: "Statistical Design"
      menu:
        - text: "Design: Adaptive Pairing"
          href: articles/within-set-adaptive-design.html
        - text: "Design: Adaptive Linking"
          href: articles/adaptive-linking-design.html

    changelog:
      text: Changelog
      href: news/index.html

    github:
      icon: fa-github
      href: https://github.com/shmercer/pairwiseLLM
      aria-label: GitHub

articles:
  - title: "Getting Started"
    contents:
      - getting-started

  - title: "Provider and Batch Workflows"
    contents:
      - data-and-prompts
      - provider-controls-and-recovery
      - model-compatibility
      - advanced-batch-workflows

  - title: "Adaptive Pairing"
    contents:
      - adaptive-pairing
      - adaptive-warm-start
      - adaptive-linking
      - linking-sessions

  - title: "Modeling and Bias"
    contents:
      - bayesian-btl
      - rubric-calibration
      - prompt-template-bias

  - title: "Statistical Design"
    desc: "Formal models, assumptions, selection rules, and stopping criteria."
    contents:
      - within-set-adaptive-design
      - adaptive-linking-design

reference:
  - title: "Start here"
    desc: "New users: follow the [Getting Started guide](../articles/getting-started.html) for an offline example and a first collection workflow."
    contents:
      - pairwiseLLM
  - title: "Prepare writing samples and pairs"
    desc: "Create pair tables locally before making provider requests."
    contents:
      - read_samples_df
      - read_samples_dir
      - make_pairs
      - sample_pairs
      - sample_reverse_pairs
      - randomize_pair_order
      - alternate_pair_order
  - title: "Choose a trait and prepare prompts"
    contents:
      - trait_description
      - set_prompt_template
      - build_prompt
      - register_prompt_template
      - get_prompt_template
      - list_prompt_templates
      - remove_prompt_template
  - title: "Collect comparisons"
    desc: "Use the generic helpers first. Cost estimation runs a paid pilot; see [provider controls and recovery](../articles/provider-controls-and-recovery.html)."
    contents:
      - check_llm_api_keys
      - submit_llm_pairs
      - llm_compare_pair
      - llm_submit_pairs_batch
      - llm_download_batch_results
      - llm_submit_pairs_multi_batch
      - llm_resume_multi_batches
      - estimate_llm_pairs_cost
      - print.pairwiseLLM_cost_estimate
  - title: "Turn comparisons into rankings"
    desc: "BT and Elo use recorded winners; Bayesian BTL additionally requires CmdStan."
    contents:
      - build_bt_data
      - fit_bt_model
      - summarize_bt_fit
      - build_elo_data
      - fit_elo_model
      - build_btl_results_data
      - fit_bayes_btl_mcmc
  - title: "Choose comparisons adaptively"
    desc: "Start with adaptive_rank(); see the [practical guide](../articles/adaptive-pairing.html)."
    contents:
      - adaptive_rank
      - make_adaptive_judge_llm
  - title: "Inspect rankings and diagnostics"
    contents:
      - print.adaptive_state
      - adaptive_get_logs
      - adaptive_step_log
      - adaptive_round_log
      - adaptive_item_log
      - adaptive_results_history
      - summarize_adaptive
      - summarize_refits
      - summarize_items
  - title: "Save and resume adaptive sessions"
    contents:
      - save_adaptive_session
      - validate_session_dir
      - load_adaptive_session
  - title: "Link separately ranked sets"
    desc: "Use saved comparisons to link sets, inspect results, and save your work; choose a method explicitly."
    contents:
      - prepare_link_input
      - start_link_session
      - save_link_session
      - summary.pairwiseLLM_link_result
      - fit_link
      - predict_link
  - title: "Convert Bayesian rankings to rubric levels"
    desc: "Requires completed Bayesian CJ results. See the [rubric guide](../articles/rubric-calibration.html) for human labels and interpretation."
    contents:
      - fit_rubric_calibration
      - predict.pairwiseLLM_rubric_calibration
      - evaluate_rubric_predictions
  - title: "Check consistency and position bias"
    contents:
      - compute_reverse_consistency
      - check_positional_bias
  - title: "Advanced: predictive warm start"
    desc: "Use the [warm-start guide](../articles/adaptive-warm-start.html) to go from features to validated models and starting scores."
    contents:
      - has_concept("adaptive warm start")
  - title: "Advanced: adaptive lifecycle and replay"
    contents:
      - make_adaptive_replay_reservoir
      - make_adaptive_judge_replay
      - validate_adaptive_replay
      - adaptive_rank_start
      - adaptive_rank_run_live
      - adaptive_rank_resume
  - title: "Provider-specific live helpers"
    contents:
      - openai_compare_pair_live
      - submit_openai_pairs_live
      - anthropic_compare_pair_live
      - submit_anthropic_pairs_live
      - gemini_compare_pair_live
      - submit_gemini_pairs_live
      - vertex_compare_pair_live
      - submit_vertex_pairs_live
      - together_compare_pair_live
      - submit_together_pairs_live
      - ollama_compare_pair_live
      - submit_ollama_pairs_live
  - title: "Provider-specific batch helpers"
    contents:
      - build_openai_batch_requests
      - write_openai_batch_file
      - openai_upload_batch_file
      - openai_create_batch
      - openai_get_batch
      - openai_poll_batch_until_complete
      - openai_download_batch_output
      - openai_download_batch_errors
      - run_openai_batch_pipeline
      - build_anthropic_batch_requests
      - anthropic_create_batch
      - anthropic_get_batch
      - anthropic_poll_batch_until_complete
      - anthropic_download_batch_results
      - run_anthropic_batch_pipeline
      - build_gemini_batch_requests
      - gemini_create_batch
      - gemini_get_batch
      - gemini_poll_batch_until_complete
      - gemini_download_batch_results
      - run_gemini_batch_pipeline
  - title: "Parse downloaded batch output"
    contents:
      - parse_openai_batch_output
      - parse_anthropic_batch_output
      - parse_gemini_batch_output
  - title: "Manage local Ollama resources"
    contents:
      - ensure_only_ollama_model_loaded
  - title: "Example data"
    desc: "Synthetic texts, bundled comparison outcomes, Bayesian input rows, and a parser fixture for offline exploration."
    contents:
      - example_writing_samples
      - example_writing_samples1000
      - example_writing_pairs
      - example_writing_results
      - example_openai_batch_output
