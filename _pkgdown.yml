url: https://shmercer.github.io/pairwiseLLM/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    base_font: "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    heading_font: "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    code_font: "'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace"

navbar:
  structure:
    left: [home, get_started, detailed_guides, reference, changelog]
    right: [search, github]

  components:
    home:
      icon: fa-home
      text: Home
      href: index.html

    reference:
      text: Reference
      href: reference/index.html

    get_started:
      text: "Get Started"
      href: articles/getting-started.html

    detailed_guides:
      text: "Detailed Guides"
      menu:
        - text: "Data Schemas and Prompt Management"
          href: articles/data-and-prompts.html
        - text: "Provider Controls and Recovery"
          href: articles/provider-controls-and-recovery.html
        - text: "Backends and Tested Model Configurations"
          href: articles/model-compatibility.html
        - text: "Advanced: Submitting and Polling Multiple Batches"
          href: articles/advanced-batch-workflows.html
        - text: "Guide: Adaptive Pairing"
          href: articles/adaptive-pairing.html
        - text: "Guide: Adaptive Warm Start"
          href: articles/adaptive-warm-start.html
        - text: "Design: Adaptive Pairing"
          href: articles/within-set-adaptive-design.html
        - text: "Guide: Adaptive Linking"
          href: articles/adaptive-linking.html
        - text: "Design: Adaptive Linking"
          href: articles/adaptive-linking-design.html
        - text: "Standalone Bayesian BTL with CmdStan"
          href: articles/bayesian-btl.html
        - text: "Prompt Template Positional Bias Testing"
          href: articles/prompt-template-bias.html

    changelog:
      text: Changelog
      href: news/index.html

    github:
      icon: fa-github
      href: https://github.com/shmercer/pairwiseLLM
      aria-label: GitHub

