# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
  push:
    tags: ['v*']

name: R-CMD-check.yaml

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    continue-on-error: ${{ matrix.config.r == 'devel' }}

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"macOS-latest","r":"release"},{"os":"ubuntu-latest","r":"release"}]' || '[{"os":"macOS-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"}]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: "https://stan-dev.r-universe.dev"

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: runner.os != 'macOS'
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # pak cannot unpack some Zstandard-compressed Sonoma binaries yet.
      # R's native installer supports them when the zstd tool is available.
      - name: Install macOS archive support
        if: runner.os == 'macOS'
        run: brew install zstd

      - name: Install macOS dependencies with the native R installer
        if: runner.os == 'macOS'
        shell: Rscript {0}
        env:
          TAR: /usr/bin/tar
        run: |
          options(install.packages.check.source = "no")
          install.packages(c("remotes", "rcmdcheck", "sessioninfo"), type = "both")
          remotes::install_deps(
            # TRUE includes this package's Suggests, but only required
            # dependencies of those packages (not their recursive Suggests).
            dependencies = TRUE,
            upgrade = "always",
            type = "both"
          )
          sessioninfo::session_info()

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
